# temperature, top_p, top_k: not documented for 1.1; they follow MAI-Code-1-Flash (same series).
schema = 2
name = "MAI-Code-1.1-Flash"
description = "Microsoft coding model with native vision support, optimized for fast and efficient software development"
family = "mai"
open_weights = false
